name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gitleaks-action@v2 requires a PAID license for GitHub ORGANIZATIONS, so it
      # exited 1 on every run since it was added (2026-07-10) without ever scanning
      # a line — "All jobs have failed" that looked like findings but was a license
      # wall. The gitleaks BINARY is MIT-licensed and free; only the Action wrapper
      # is not. Run the binary directly: same scanner, no license, ~10s.
      - name: gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          # Scan the working tree, not full history: history findings are handled
          # once, deliberately, by rotation — not by failing every future build on
          # a commit nobody can change. --redact keeps any hit out of public logs.
          ./gitleaks dir . --config .gitleaks.toml --redact --verbose --exit-code 1
